# ============================================================================
# Netlify deployment — Zinachic (Next.js 14 App Router)
# ============================================================================
# This app is NOT a static site: it has API routes, middleware, and server
# rendering. It requires the Netlify Next.js Runtime (@netlify/plugin-nextjs)
# to turn API routes into Functions, middleware into an Edge Function, and to
# serve next/image through the Netlify Image CDN.
#
# We declare the runtime EXPLICITLY below because auto-detection was not
# activating it on this site — successful builds were being published as the
# raw `.next` folder (static), which 404s on every route. Declaring the plugin
# with no version installs the current major (v5), NOT the legacy v4, so this
# does not reintroduce the old next/image problem.
# ============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next 14 + sharp 0.35 require Node >= 18.17; use the current LTS.
  NODE_VERSION = "20"
  # Ensure devDependencies (TypeScript, types) are available at build time.
  NPM_FLAGS = "--include=dev"
  # NEXT_PUBLIC_* vars are PUBLIC by design (embedded in the client bundle), so
  # Netlify's secret scanner correctly finds them in the build output. Exempt
  # ONLY these public keys — real secrets (service role, Stripe) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# NOTE: force=true makes this win even though /lookbook exists as a page.
[[redirects]]
  from = "/lookbook"
  to = "/produits"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# API responses must never be cached (auth, checkout, orders).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
