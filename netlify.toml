# ============================================================================
# Netlify deployment — Zinachic (Next.js 14 App Router)
# ============================================================================
# This app is NOT a static site: it has API routes, middleware, and server
# rendering. Netlify auto-detects Next.js and installs its built-in Next.js
# Runtime (v5), which turns API routes into Functions, middleware into an Edge
# Function, and serves next/image through the Netlify Image CDN.
#
# IMPORTANT: do NOT add `[[plugins]] @netlify/plugin-nextjs` here — declaring it
# pins the legacy v4 runtime, which breaks next/image on Netlify. Leaving it out
# lets Netlify use the current v5 runtime automatically.
# ============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 14 + sharp 0.35 require Node >= 18.17; use the current LTS.
  NODE_VERSION = "20"
  # Ensure devDependencies (TypeScript, types) are available at build time.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# NOTE: force=true makes this win even though /lookbook exists as a page.
[[redirects]]
  from = "/lookbook"
  to = "/produits"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# API responses must never be cached (auth, checkout, orders).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
